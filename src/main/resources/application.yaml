spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fny
  datasource:
    url: jdbc:h2:mem:fny;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/gmail.readonly

fny:
  frontend:
    base-url: ${FNY_FRONTEND_BASE_URL:http://localhost:5173}
  agent:
    enabled: true
    base-url: http://localhost:8000
