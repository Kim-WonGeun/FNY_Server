spring:
  application:
    name: fny
  datasource:
    url: jdbc:h2:mem:fny;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

fny:
  agent:
    enabled: true
    base-url: http://localhost:8000
